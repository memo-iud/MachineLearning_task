name: EA1 - Carga y resumen del dataset

# Se ejecuta solo cuando cambia algo que afecta a la actividad 1.
on:
  push:
    branches: [main]
    paths:
      - "src/actividades/EA1/**"
      - "src/clases_po/**"
      - "requirements.txt"
      - ".github/workflows/ea1.yml"
  workflow_dispatch:

permissions:
  contents: write   # necesario para guardar los resultados en el repositorio

# EA1 y EA2 comparten este grupo para no publicar resultados al mismo tiempo.
concurrency:
  group: publicar-resultados-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ejecutar-ea1:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reutilizar la caché de Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-pointe77-credit-card-transaction-v1

      - name: Limpiar resultados anteriores
        run: rm -rf src/actividades/EA1/reportes src/actividades/EA1/datos

      - name: Ejecutar EA1.ipynb
        working-directory: src/actividades/EA1
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1800 \
            EA1.ipynb

      - name: Publicar resultados como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: resultados-ea1
          path: |
            src/actividades/EA1/reportes/
            src/actividades/EA1/EA1.ipynb
          if-no-files-found: error

      - name: Guardar resultados en el repositorio
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/actividades/EA1/reportes src/actividades/EA1/EA1.ipynb
          if git diff --cached --quiet; then
            echo "No hubo cambios en los resultados."
            exit 0
          fi
          git commit -m "chore(ea1): actualizar resultados generados [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
