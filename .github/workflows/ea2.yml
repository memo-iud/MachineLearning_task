name: EA2 - Regresión y clasificación

# Se ejecuta solo cuando cambia algo que afecta a la actividad 2.
on:
  push:
    branches: [main]
    paths:
      - "src/actividades/EA2/**"
      - "src/clases_po/**"
      - "requirements.txt"
      - ".github/workflows/ea2.yml"
  workflow_dispatch:

permissions:
  contents: write   # necesario para guardar los resultados en el repositorio

# EA1 y EA2 comparten este grupo para no publicar resultados al mismo tiempo.
concurrency:
  group: publicar-resultados-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ejecutar-ea2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reutilizar la caché de Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-pointe77-credit-card-transaction-v1

      - name: Limpiar resultados anteriores
        run: rm -rf src/actividades/EA2/salidas src/actividades/EA2/datos src/actividades/EA2/modelos

      - name: Ejecutar flujo completo de la EA2
        working-directory: src/actividades/EA2
        run: python main.py

      - name: Publicar resumen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: resultados-ea2
          path: src/actividades/EA2/salidas/
          if-no-files-found: error

      - name: Guardar copia de los resultados en el repositorio
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/actividades/EA2/salidas
          if git diff --cached --quiet; then
            echo "No hubo cambios en los resultados."
            exit 0
          fi
          git commit -m "chore(ea2): actualizar resultados generados [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
